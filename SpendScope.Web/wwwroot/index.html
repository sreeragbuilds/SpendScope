<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpendScope: see where every dollar goes</title>
    <meta name="description" content="SpendScope is a personal expense tracker. Record spending in seconds, then see category totals and monthly trends at a glance." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1726" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph and social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpendScope" />
    <meta property="og:title" content="SpendScope: see where every dollar goes" />
    <meta property="og:description" content="Record expenses in seconds and see where your money goes by category and month." />
    <meta property="og:image" content="https://spendscope-v9u5.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SpendScope logo on a teal background: See where every dollar goes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpendScope: see where every dollar goes" />
    <meta name="twitter:description" content="Record expenses in seconds and see where your money goes by category and month." />
    <meta name="twitter:image" content="https://spendscope-v9u5.onrender.com/og-image.png" />

    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- Fonts are self-hosted (a serif for headline figures, a sans for everything else), so no
         visitor request goes to a third party. The body font is preloaded to avoid a late swap. -->
    <link rel="preload" href="fonts/instrumentsans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div id="app">
        <div class="boot" role="status" aria-live="polite">
            <svg class="loading-progress" aria-hidden="true" focusable="false">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <p class="boot-name">SpendScope</p>
            <p class="boot-text">Loading your money&hellip;</p>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong. Reload the page to continue.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <!-- Chart.js pinned to an exact version (spec 19.7) with Subresource Integrity: the browser
         refuses the file if the CDN ever serves different bytes. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
            integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
            crossorigin="anonymous"></script>
    <!-- Not deferred: these must be defined before Blazor starts and makes its first JS interop call. -->
    <script src="js/charts.js"></script>
    <script src="js/browser.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
