# Render Blueprint: infrastructure as code for SpendScope (see docs/adr/0004-render-deployment.md).
# Secrets never live in this file: the database URL comes from the database itself and the JWT
# signing key is generated by Render.

databases:
  - name: spendscope-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only; no access from the internet

services:
  - type: web
    name: spendscope
    runtime: docker
    plan: free
    region: singapore
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # A deploy only goes live once PostgreSQL is reachable, so a broken database setting fails
    # the deploy instead of replacing a working version.
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendscope-db
          property: connectionString # internal URL
      - key: Jwt__SigningKey
        generateValue: true # 256-bit random value, created once by Render
      - key: ForwardedHeaders__Enabled
        value: "true"
      # The free plan has no pre-deploy step, so migrations run at startup (single instance).
      - key: Database__MigrateOnStartup
        value: "true"
      - key: App__PublicBaseUrl
        value: https://spendscope.onrender.com
